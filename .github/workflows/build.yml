name: build-image
on: [workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t python312-django:1.0 .

      - name: Verify Python and libraries
        run: |
          docker run --rm python312-django:1.0 python --version
          docker run --rm python312-django:1.0 pip list

      - name: Save image
        run: docker save python312-django:1.0 | gzip > python312-django.tar.gz

      - uses: actions/upload-artifact@v4
        with:
          name: python312-django-image
          path: python312-django.tar.gz
          retention-days: 7
